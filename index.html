<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flip 7 Score">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Flip 7 Score</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--panel2:#eef2f7;--line:#cbd5e1;--text:#111827;
  --muted:#64748b;--accent:#166534;--accent-soft:#dcfce7;--danger:#b91c1c;
  --danger-soft:#fee2e2;--warn:#92400e;--warn-soft:#fef3c7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none}
button,input,select{font:inherit;color:var(--text)}
button{touch-action:manipulation}
.app{width:min(100%,1180px);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.title{font-size:22px;font-weight:900}
.round{font-size:14px;color:var(--muted);margin-top:2px}
.topActions{display:flex;gap:8px}
.starterBanner{margin:0 0 10px;padding:10px 12px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;font-weight:900;color:#14532d;text-align:center}
.orderRow{display:flex;gap:6px;justify-content:center;margin-top:7px}
.orderBtn{min-height:34px;min-width:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900}
.orderBtn:disabled{opacity:.35}
.modebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.modebtn,.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:12px;min-height:48px;font-weight:800;
}
.modebtn{padding:0 16px}
.modebtn.on{background:var(--accent-soft);border-color:var(--accent);color:#14532d}
.modebtn.kill.on{background:var(--danger-soft);border-color:var(--danger);color:#7f1d1d}
.players{display:grid;gap:10px;margin-bottom:10px}
.players.p2{grid-template-columns:repeat(2,minmax(0,1fr))}
.players.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
.players.p4{grid-template-columns:repeat(4,minmax(0,1fr))}
.players.p5,.players.p6{grid-template-columns:repeat(3,minmax(0,1fr))}
.players.p7,.players.p8{grid-template-columns:repeat(4,minmax(0,1fr))}
.player{
  display:block;width:100%;border:2px solid var(--line);background:var(--panel);
  border-radius:18px;padding:12px;min-width:0;text-align:left;box-shadow:0 1px 3px rgba(15,23,42,.08)
}
.player.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,101,52,.10)}
.pname{
  width:100%;background:transparent;border:0;border-bottom:1px solid transparent;
  color:var(--text)!important;-webkit-text-fill-color:var(--text);font-weight:800;
  font-size:17px;text-align:center;outline:none;padding:2px 4px 7px
}
.scoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.scoreBox{background:var(--panel2);border-radius:12px;padding:8px;text-align:center}
.scoreLabel{font-size:12px;color:var(--muted);font-weight:700}
.totalScore{font-size:48px;line-height:1;font-weight:950;color:#000!important;-webkit-text-fill-color:#000;font-variant-numeric:tabular-nums;margin-top:4px}
.roundScore{font-size:38px;line-height:1;font-weight:900;color:#000!important;-webkit-text-fill-color:#000;font-variant-numeric:tabular-nums;margin-top:7px}
.negative{color:var(--danger)!important;-webkit-text-fill-color:var(--danger)!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.activeHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}
.small{font-size:12px;color:var(--muted);font-weight:700}
.activeName{font-size:24px;font-weight:900}
.liveBig{font-size:54px;line-height:.95;font-weight:950;color:#000!important;-webkit-text-fill-color:#000;font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.btn{padding:4px 8px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:#14532d}
.btn.danger.on{background:var(--danger-soft);border-color:var(--danger);color:#7f1d1d}
.btn.warn.on{background:var(--warn-soft);border-color:var(--warn);color:#78350f}
.mods{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.attackbox{margin-top:10px;padding:10px;border-radius:12px;border:1px solid #fecaca;background:#fff7f7}
.attackrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.attackselect{width:100%;min-height:48px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 10px}
.formula{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;color:#334155;font-size:13px;min-height:42px}
.actions{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin-top:10px}
.primary{background:#166534;color:#fff;border-color:#166534}
.winner{margin-top:10px;padding:12px;border-radius:12px;background:#fef3c7;color:#78350f;font-weight:900;text-align:center}
.footer{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:11px}
.hidden{display:none!important}
.dialogBack{
  position:fixed;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:20
}
.dialog{width:min(92vw,440px);background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.dialog h2{margin:0 0 14px;font-size:21px}
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:10px 0}
.field select,.field input{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.dialogActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

@media (min-width:700px) and (max-aspect-ratio:1.45/1){
  .app{padding-left:18px;padding-right:18px}
  .players{gap:12px}.player{padding:14px}
  .players.p4 .totalScore,.players.p3 .totalScore,.players.p2 .totalScore{font-size:58px}
  .players.p4 .roundScore,.players.p3 .roundScore,.players.p2 .roundScore{font-size:44px}
  .players.p5 .totalScore,.players.p6 .totalScore{font-size:52px}
  .players.p7 .totalScore,.players.p8 .totalScore{font-size:43px}
  .players.p5 .roundScore,.players.p6 .roundScore{font-size:40px}
  .players.p7 .roundScore,.players.p8 .roundScore{font-size:34px}
  .liveBig{font-size:64px}.btn{min-height:54px;font-size:17px}.panel{padding:16px}
}
@media (max-width:699px){
  .app{padding-left:10px;padding-right:10px}
  .players,.players.p2,.players.p3,.players.p4,.players.p5,.players.p6,.players.p7,.players.p8{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .player{padding:9px}.pname{font-size:15px}.totalScore{font-size:38px}.roundScore{font-size:31px}
  .liveBig{font-size:46px}.nums{gap:6px}.mods{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .btn{min-height:46px;font-size:14px}.title{font-size:18px}
}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div>
      <div class="title">Flip 7: With a Vengeance</div>
      <div class="round" id="roundLabel"></div>
    </div>
    <div class="topActions">
      <button class="btn" id="settingsBtn" style="padding:0 14px">設定</button>
      <button class="btn" id="newGameBtn" style="padding:0 14px">新規</button>
    </div>
  </div>

  <div class="modebar">
    <span class="small">ゲームモード</span>
    <button class="modebtn" id="normalModeBtn">通常モード</button>
    <button class="modebtn kill" id="killModeBtn">殺伐モード</button>
  </div>

  <div class="starterBanner" id="starterBanner"></div>

  <section class="players" id="players"></section>

  <section class="panel">
    <div class="activeHead">
      <div><div class="small">入力中</div><div class="activeName" id="activeName"></div></div>
      <div style="text-align:right"><div class="small">今回</div><div class="liveBig" id="liveScore">0</div></div>
    </div>

    <div class="nums" id="numButtons"></div>

    <div class="mods">
      <button class="btn" data-mod="half">÷2</button>
      <button class="btn" data-mod="2">−2</button>
      <button class="btn" data-mod="4">−4</button>
      <button class="btn" data-mod="6">−6</button>
      <button class="btn" data-mod="8">−8</button>
      <button class="btn" data-mod="10">−10</button>
      <button class="btn warn" id="unluckyBtn">Unlucky 7</button>
      <button class="btn" id="flip7Btn">FLIP 7</button>
      <button class="btn danger" id="bustBtn">BUST</button>
      <button class="btn" id="zeroBtn">The Zero</button>
      <button class="btn" id="lucky13Btn">Lucky 13</button>
      <button class="btn" id="clearBtn">入力クリア</button>
    </div>

    <div class="attackbox hidden" id="attackBox">
      <div style="font-weight:900">Flip 7 ボーナス（殺伐モード）</div>
      <div class="attackrow">
        <button class="btn" id="selfBonusBtn">自分 +15</button>
        <button class="btn danger" id="attackBonusBtn">相手 −15</button>
      </div>
      <select id="attackTarget" class="attackselect hidden"></select>
    </div>

    <div class="formula" id="formula"></div>

    <div class="actions">
      <button class="btn" id="undoRoundBtn">1R戻す</button>
      <button class="btn" id="nextPlayerBtn">次の人</button>
      <button class="btn primary" id="commitBtn">ラウンド確定</button>
    </div>
  </section>

  <div class="winner hidden" id="winner"></div>
  <div class="footer"><span>自動保存 / オフライン対応</span><span id="saveState">保存済み</span></div>
</main>

<div class="dialogBack hidden" id="settingsDialog">
  <div class="dialog">
    <h2>ゲーム設定</h2>
    <div class="field">
      <label for="playerCount">プレイヤー数</label>
      <select id="playerCount">
        <option value="2">2人</option><option value="3">3人</option><option value="4">4人</option>
        <option value="5">5人</option><option value="6">6人</option><option value="7">7人</option><option value="8">8人</option>
      </select>
    </div>
    <div class="field">
      <label for="targetScore">目標点</label>
      <input id="targetScore" type="number" min="1" step="1" value="200">
    </div>
    <div class="small">人数を減らすと、末尾のプレイヤーの得点・入力内容は削除されます。</div>
    <div class="dialogActions">
      <button class="btn" id="cancelSettings">キャンセル</button>
      <button class="btn primary" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY='flip7-v-score-v4';
  const previousKeys=['flip7-v-score-v3','flip7-v-score-v2','flip7-v-score-v1'];

  function blankHand(){return {nums:{},half:false,mods:[],bust:false,flip7:false,theZero:false,lucky13:false,unlucky:false,bonusChoice:'self',attackTarget:null}}
  function newPlayer(i){return {name:`PLAYER ${i+1}`,total:0,hand:blankHand()}}
  function freshState(){return {round:1,target:200,active:0,mode:'normal',playerCount:4,starter:0,players:Array.from({length:4},(_,i)=>newPlayer(i)),history:[]}}
  function normalize(s){
    s.mode=s.mode==='kill'?'kill':'normal';
    s.playerCount=Math.max(2,Math.min(8,Number(s.playerCount)||((s.players||[]).length||4)));
    s.players=Array.isArray(s.players)?s.players.slice(0,s.playerCount):[];
    while(s.players.length<s.playerCount)s.players.push(newPlayer(s.players.length));
    s.players.forEach((p,i)=>{p.name=p.name||`PLAYER ${i+1}`;p.total=Number(p.total)||0;p.hand={...blankHand(),...(p.hand||{})};p.hand.mods=Array.isArray(p.hand.mods)?p.hand.mods:[]});
    s.history=Array.isArray(s.history)?s.history:[];
    s.active=Math.max(0,Math.min(s.playerCount-1,Number(s.active)||0));
    s.starter=Math.max(0,Math.min(s.playerCount-1,Number(s.starter)||0));
    s.round=Math.max(1,Number(s.round)||1);
    s.target=Math.max(1,Number(s.target)||200);
    return s;
  }
  function load(){
    try{
      let raw=localStorage.getItem(STORAGE_KEY);if(raw)return normalize(JSON.parse(raw));
      for(const k of previousKeys){raw=localStorage.getItem(k);if(raw)return normalize(JSON.parse(raw))}
    }catch(e){}
    return freshState();
  }

  const state=load(),$=s=>document.querySelector(s);
  function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('#saveState').textContent='保存済み'}
  function count(h){return Object.values(h.nums).reduce((a,b)=>a+(Number(b)||0),0)}
  function flip(h){return h.flip7||count(h)>=7}

  function ownScore(h){
    const f=flip(h);
    if(h.theZero&&!f)return 0;
    let s;
    if(h.bust){if(state.mode==='normal')return 0;s=0}
    else{
      s=Object.entries(h.nums).reduce((a,[n,c])=>a+Number(n)*Number(c),0);
      if(h.half)s=Math.floor(s/2);
    }
    for(const m of h.mods)s-=m;
    if(state.mode==='normal')s=Math.max(0,s);
    if(f&&(state.mode==='normal'||h.bonusChoice!=='attack'))s+=15;
    return s;
  }
  function incoming(i){
    if(state.mode!=='kill')return 0;
    let p=0;
    state.players.forEach((pl,j)=>{
      const h=pl.hand;
      if(j!==i&&flip(h)&&h.bonusChoice==='attack'&&Number(h.attackTarget)===i)p-=15;
    });
    return p;
  }
  function shown(i){return ownScore(state.players[i].hand)+incoming(i)}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  function breakdown(i){
    const h=state.players[i].hand,f=flip(h),inc=incoming(i),parts=[];
    if(h.theZero&&!f)parts.push('The Zero → 0点');
    else if(h.bust){
      if(state.mode==='normal')parts.push('BUST → 0点');
      else{parts.push('BUST → 基礎0点');const minus=h.mods.reduce((a,b)=>a+b,0);if(minus)parts.push(`修正 −${minus}`)}
    }else{
      let s=Object.entries(h.nums).reduce((a,[n,c])=>a+Number(n)*Number(c),0);
      parts.push(`数字合計 ${s}`);
      if(h.half){s=Math.floor(s/2);parts.push(`÷2 → ${s}`)}
      const minus=h.mods.reduce((a,b)=>a+b,0);
      if(minus){s-=minus;if(state.mode==='normal')s=Math.max(0,s);parts.push(`−${minus} → ${s}`)}
    }
    if(f){
      if(state.mode==='kill'&&h.bonusChoice==='attack'){
        const t=state.players[Number(h.attackTarget)];
        parts.push(t?`${t.name} に −15`:'相手に −15');
      }else parts.push('Flip 7 +15');
    }
    if(inc)parts.push(`他プレイヤーから ${inc}`);
    parts.push(`今回 ${shown(i)}点`);
    return parts.join('　');
  }

  function movePlayer(from,to){
    if(from===to||from<0||to<0||from>=state.playerCount||to>=state.playerCount)return;
    const [moved]=state.players.splice(from,1);
    state.players.splice(to,0,moved);

    function remapIndex(idx){
      if(idx===from)return to;
      if(from<to && idx>from && idx<=to)return idx-1;
      if(to<from && idx>=to && idx<from)return idx+1;
      return idx;
    }
    state.active=remapIndex(state.active);
    state.starter=remapIndex(state.starter);
    state.players.forEach(p=>{
      const t=p.hand.attackTarget;
      if(t!==null)p.hand.attackTarget=remapIndex(Number(t));
    });
    save();render();
  }

  function renderPlayers(){
    const wrap=$('#players');wrap.className=`players p${state.playerCount}`;wrap.innerHTML='';
    state.players.forEach((p,i)=>{
      const rs=shown(i),card=document.createElement('button');
      card.type='button';card.className='player'+(i===state.active?' active':'');
      card.innerHTML=`<input class="pname" data-name="${i}" value="${esc(p.name)}">
      <div class="scoreGrid">
        <div class="scoreBox"><div class="scoreLabel">累計</div><div class="totalScore ${p.total<0?'negative':''}">${p.total}</div></div>
        <div class="scoreBox"><div class="scoreLabel">今回</div><div class="roundScore ${rs<0?'negative':''}">${rs}</div></div>
      </div>
      ${state.round===1 && state.history.length===0 ? `<div class="orderRow">
        <button type="button" class="orderBtn" data-move-left="${i}" ${i===0?'disabled':''}>←</button>
        <button type="button" class="orderBtn" data-move-right="${i}" ${i===state.playerCount-1?'disabled':''}>→</button>
      </div>` : ''}`;
      card.addEventListener('click',e=>{if(e.target.matches('input,button'))return;state.active=i;save();render()});
      wrap.appendChild(card);
    });
    wrap.querySelectorAll('.pname').forEach(inp=>{
      inp.addEventListener('click',e=>e.stopPropagation());
      inp.addEventListener('change',e=>{const i=Number(e.target.dataset.name);state.players[i].name=e.target.value.trim()||`PLAYER ${i+1}`;save();render()});
    });
    wrap.querySelectorAll('[data-move-left]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const i=Number(b.dataset.moveLeft); if(i<=0)return;
      movePlayer(i,i-1);
    }));
    wrap.querySelectorAll('[data-move-right]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const i=Number(b.dataset.moveRight); if(i>=state.playerCount-1)return;
      movePlayer(i,i+1);
    }));
  }

  function renderNumbers(){
    const h=state.players[state.active].hand,wrap=$('#numButtons');wrap.innerHTML='';
    for(let n=0;n<=13;n++){
      const c=h.nums[n]||0,b=document.createElement('button');
      b.type='button';b.className='btn'+(c?' on':'');b.textContent=(n===13&&c===2)?'13×2':String(n);
      b.addEventListener('click',()=>{
        const cur=h.nums[n]||0;
        if(n===13&&h.lucky13)h.nums[n]=(cur+1)%3;else h.nums[n]=cur?0:1;
        if(n===0)h.theZero=!!h.nums[0];
        save();render();
      });
      wrap.appendChild(b);
    }
  }

  function renderMods(){
    const h=state.players[state.active].hand;
    document.querySelectorAll('[data-mod]').forEach(b=>{const v=b.dataset.mod,on=v==='half'?h.half:h.mods.includes(Number(v));b.classList.toggle('on',on)});
    $('#bustBtn').classList.toggle('on',h.bust);
    $('#flip7Btn').classList.toggle('on',flip(h));
    $('#zeroBtn').classList.toggle('on',h.theZero);
    $('#lucky13Btn').classList.toggle('on',h.lucky13);
    $('#unluckyBtn').classList.toggle('on',h.unlucky);
  }

  function renderAttack(){
    const h=state.players[state.active].hand,show=state.mode==='kill'&&flip(h);
    $('#attackBox').classList.toggle('hidden',!show);
    if(!show)return;
    $('#selfBonusBtn').classList.toggle('on',h.bonusChoice!=='attack');
    $('#attackBonusBtn').classList.toggle('on',h.bonusChoice==='attack');
    const sel=$('#attackTarget');
    sel.innerHTML=state.players.map((p,i)=>i===state.active?'':`<option value="${i}">${esc(p.name)} −15</option>`).join('');
    if(h.attackTarget===null||Number(h.attackTarget)===state.active||!state.players[Number(h.attackTarget)]){
      h.attackTarget=(state.active+1)%state.playerCount;
    }
    sel.value=String(h.attackTarget);
    sel.classList.toggle('hidden',h.bonusChoice!=='attack');
  }

  function render(){
    const p=state.players[state.active],rs=shown(state.active);
    $('#activeName').textContent=p.name;
    $('#liveScore').textContent=rs;
    $('#liveScore').classList.toggle('negative',rs<0);
    $('#formula').textContent=breakdown(state.active);
    $('#roundLabel').textContent=`Round ${state.round} / ${state.playerCount}人 / 目標 ${state.target}`;
    $('#starterBanner').textContent=`このラウンドのスタート: ${state.players[state.starter]?.name || ''}`;
    $('#normalModeBtn').classList.toggle('on',state.mode==='normal');
    $('#killModeBtn').classList.toggle('on',state.mode==='kill');
    renderPlayers();renderNumbers();renderMods();renderAttack();

    const winners=state.players.filter(p=>p.total>=state.target),win=$('#winner');
    if(winners.length){
      const max=Math.max(...state.players.map(p=>p.total)),tops=state.players.filter(p=>p.total===max);
      win.textContent=`現在トップ: ${tops.map(p=>p.name).join(' / ')} (${max}点)`;
      win.classList.remove('hidden');
    }else win.classList.add('hidden');
  }

  document.querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{
    const h=state.players[state.active].hand,v=b.dataset.mod;
    if(v==='half')h.half=!h.half;
    else{const n=Number(v),idx=h.mods.indexOf(n);idx>=0?h.mods.splice(idx,1):h.mods.push(n)}
    save();render();
  }));
  $('#normalModeBtn').addEventListener('click',()=>{state.mode='normal';save();render()});
  $('#killModeBtn').addEventListener('click',()=>{state.mode='kill';save();render()});
  $('#bustBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.bust=!h.bust;save();render()});
  $('#flip7Btn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.flip7=!h.flip7;if(!flip(h)){h.bonusChoice='self';h.attackTarget=null}save();render()});
  $('#zeroBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.theZero=!h.theZero;h.nums[0]=h.theZero?1:0;save();render()});
  $('#lucky13Btn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.lucky13=!h.lucky13;if(!h.lucky13&&(h.nums[13]||0)>1)h.nums[13]=1;save();render()});
  $('#unluckyBtn').addEventListener('click',()=>{const h=blankHand();h.unlucky=true;h.nums[7]=1;state.players[state.active].hand=h;save();render()});
  $('#clearBtn').addEventListener('click',()=>{state.players[state.active].hand=blankHand();save();render()});
  $('#selfBonusBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.bonusChoice='self';save();render()});
  $('#attackBonusBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.bonusChoice='attack';if(h.attackTarget===null||Number(h.attackTarget)===state.active)h.attackTarget=(state.active+1)%state.playerCount;save();render()});
  $('#attackTarget').addEventListener('change',e=>{state.players[state.active].hand.attackTarget=Number(e.target.value);save();render()});
  $('#nextPlayerBtn').addEventListener('click',()=>{state.active=(state.active+1)%state.playerCount;save();render()});

  $('#commitBtn').addEventListener('click',()=>{
    const scores=state.players.map((_,i)=>shown(i));
    state.history.push({scores,mode:state.mode,playerCount:state.playerCount});
    scores.forEach((s,i)=>state.players[i].total+=s);
    state.players.forEach(p=>p.hand=blankHand());
    state.starter=(state.starter+1)%state.playerCount;
    state.active=state.starter;
    state.round+=1;save();render();
  });

  $('#undoRoundBtn').addEventListener('click',()=>{
    const last=state.history.pop();if(!last)return;
    const n=Math.min(last.scores.length,state.players.length);
    for(let i=0;i<n;i++)state.players[i].total-=last.scores[i];
    state.round=Math.max(1,state.round-1);
    state.starter=(state.starter-1+state.playerCount)%state.playerCount;
    state.players.forEach(p=>p.hand=blankHand());
    state.active=state.starter;save();render();
  });

  $('#newGameBtn').addEventListener('click',()=>{
    if(!confirm('現在の得点を消して新しいゲームを開始しますか？'))return;
    state.round=1;state.starter=0;state.active=0;state.history=[];
    state.players.forEach(p=>{p.total=0;p.hand=blankHand()});
    save();render();
  });

  $('#settingsBtn').addEventListener('click',()=>{
    $('#playerCount').value=String(state.playerCount);
    $('#targetScore').value=String(state.target);
    $('#settingsDialog').classList.remove('hidden');
  });
  $('#cancelSettings').addEventListener('click',()=>$('#settingsDialog').classList.add('hidden'));
  $('#saveSettings').addEventListener('click',()=>{
    const newCount=Math.max(2,Math.min(8,Number($('#playerCount').value)||4));
    const newTarget=Math.max(1,Number($('#targetScore').value)||200);

    if(newCount<state.playerCount){
      const removed=state.players.slice(newCount);
      const hasData=removed.some(p=>p.total!==0||count(p.hand)>0||p.hand.bust||p.hand.mods.length);
      if(hasData&&!confirm(`${state.playerCount}人から${newCount}人に減らすと、削除されるプレイヤーの得点と入力内容も消えます。続けますか？`))return;
    }

    if(newCount>state.playerCount){
      while(state.players.length<newCount)state.players.push(newPlayer(state.players.length));
    }else if(newCount<state.playerCount){
      state.players=state.players.slice(0,newCount);
      state.history=[]; // 人数変更後の誤ったUndoを防ぐ
    }
    state.playerCount=newCount;
    state.target=newTarget;
    state.active=Math.min(state.active,newCount-1);
    state.starter=Math.min(state.starter,newCount-1);
    state.players.forEach((p,i)=>{
      if(p.hand.attackTarget!==null && !state.players[Number(p.hand.attackTarget)]){
        p.hand.attackTarget=(i+1)%newCount;
      }
    });
    save();
    $('#settingsDialog').classList.add('hidden');
    render();
  });

  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  render();
})();
</script>
</body>
</html>
