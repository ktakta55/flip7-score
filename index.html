<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip 7 Score">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Flip 7 Score</title>
  <style>
    :root{
      --bg:#0f172a;--panel:#111827;--panel2:#1f2937;--line:#374151;--text:#f9fafb;
      --muted:#9ca3af;--accent:#22c55e;--danger:#ef4444;--warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    button{touch-action:manipulation}
    .app{max-width:980px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom))}
    .top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
    .title{font-weight:800;font-size:18px}
    .round{color:var(--muted);font-size:13px}
    .modebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .modebtn{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:700}
    .modebtn.on{background:#14532d;border-color:var(--accent)}
    .modebtn.kill.on{background:#7f1d1d;border-color:var(--danger)}
    .players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
    .player{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px;min-width:0;text-align:left}
    .player.active{border-color:var(--accent)}
    .pname{width:100%;background:transparent;border:0;color:var(--text);font-weight:700;text-align:center;outline:none}
    .scores{display:flex;justify-content:space-between;gap:6px;align-items:end;margin-top:4px}
    .small{font-size:10px;color:var(--muted)}
    .big{font-size:26px;font-weight:900;line-height:1}
    .live{font-size:21px;font-weight:800;line-height:1}
    .negative{color:#fca5a5}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
    .activeHead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:8px}
    .activeName{font-size:20px;font-weight:800}
    .nums{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
    .btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800}
    .btn.on{background:#14532d;border-color:var(--accent)}
    .btn.danger.on{background:#7f1d1d;border-color:var(--danger)}
    .btn.warn.on{background:#78350f;border-color:var(--warn)}
    .attackbox{margin-top:8px;padding:9px;border-radius:10px;border:1px solid #7f1d1d;background:#2a1010}
    .attackrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
    .attackselect{width:100%;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 8px}
    .actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-top:8px}
    .primary{background:#166534;border-color:var(--accent)}
    .formula{margin-top:8px;padding:8px;border-radius:10px;background:#0b1220;color:#cbd5e1;font-size:12px;min-height:34px}
    .footer{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:11px}
    .winner{margin-top:8px;padding:10px;border-radius:12px;background:#3f3f0d;color:#fef3c7;font-weight:800;text-align:center}
    .hidden{display:none!important}
    @media (orientation:landscape) and (max-height:600px){
      .app{padding-top:6px}.player{padding:6px}.big{font-size:22px}.live{font-size:18px}
      .btn{min-height:38px}.panel{padding:8px}.formula{display:none}
    }
    @media (max-width:520px){
      .players{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:24px}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <div>
      <div class="title">Flip 7: With a Vengeance</div>
      <div class="round" id="roundLabel">Round 1 / 目標 200</div>
    </div>
    <button class="btn" id="newGameBtn" style="padding:0 12px;min-height:40px">新規</button>
  </div>

  <div class="modebar">
    <span class="small">ゲームモード</span>
    <button class="modebtn" id="normalModeBtn">通常モード</button>
    <button class="modebtn kill" id="killModeBtn">殺伐モード</button>
  </div>

  <section class="players" id="players"></section>

  <section class="panel">
    <div class="activeHead">
      <div><div class="small">入力中</div><div class="activeName" id="activeName">PLAYER 1</div></div>
      <div style="text-align:right"><div class="small">今回</div><div class="big" id="liveScore">0</div></div>
    </div>

    <div class="nums" id="numButtons"></div>

    <div class="mods">
      <button class="btn" data-mod="half">÷2</button>
      <button class="btn" data-mod="2">−2</button>
      <button class="btn" data-mod="4">−4</button>
      <button class="btn" data-mod="6">−6</button>
      <button class="btn" data-mod="8">−8</button>
      <button class="btn" data-mod="10">−10</button>
      <button class="btn warn" id="unluckyBtn">Unlucky 7</button>
      <button class="btn" id="flip7Btn">FLIP 7</button>
      <button class="btn danger" id="bustBtn">BUST</button>
      <button class="btn" id="zeroBtn">The Zero</button>
      <button class="btn" id="lucky13Btn">Lucky 13</button>
      <button class="btn" id="clearBtn">入力クリア</button>
    </div>

    <div class="attackbox hidden" id="attackBox">
      <div style="font-weight:800">Flip 7 ボーナス（殺伐モード）</div>
      <div class="attackrow">
        <button class="btn" id="selfBonusBtn">自分 +15</button>
        <button class="btn danger" id="attackBonusBtn">相手 −15</button>
      </div>
      <select id="attackTarget" class="attackselect hidden" aria-label="マイナス15点の対象"></select>
    </div>

    <div class="formula" id="formula">数字をタップしてください。</div>

    <div class="actions">
      <button class="btn" id="undoRoundBtn">1R戻す</button>
      <button class="btn" id="nextPlayerBtn">次の人</button>
      <button class="btn primary" id="commitBtn">ラウンド確定</button>
    </div>
  </section>

  <div class="winner hidden" id="winner"></div>
  <div class="footer"><span>自動保存 / オフライン対応</span><span id="saveState">保存済み</span></div>
</main>

<script>
(() => {
  const STORAGE_KEY='flip7-v-score-v2';
  const oldKey='flip7-v-score-v1';

  function blankHand(){
    return {nums:{},half:false,mods:[],bust:false,flip7:false,theZero:false,lucky13:false,unlucky:false,bonusChoice:'self',attackTarget:null};
  }
  function freshState(){
    return {round:1,target:200,active:0,mode:'normal',
      players:Array.from({length:4},(_,i)=>({name:`PLAYER ${i+1}`,total:0,hand:blankHand()})),
      history:[]};
  }
  function load(){
    try {
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw) return normalize(JSON.parse(raw));
      const old=localStorage.getItem(oldKey);
      if(old) return normalize({...JSON.parse(old),mode:'normal'});
    } catch(e){}
    return freshState();
  }
  function normalize(s){
    s.mode=s.mode==='kill'?'kill':'normal';
    s.players=(s.players||freshState().players).slice(0,4);
    while(s.players.length<4) s.players.push({name:`PLAYER ${s.players.length+1}`,total:0,hand:blankHand()});
    s.players.forEach((p,i)=>{p.name=p.name||`PLAYER ${i+1}`;p.total=Number(p.total)||0;p.hand={...blankHand(),...(p.hand||{})};p.hand.mods=Array.isArray(p.hand.mods)?p.hand.mods:[];});
    s.history=Array.isArray(s.history)?s.history:[];
    s.active=Math.max(0,Math.min(3,Number(s.active)||0));
    s.round=Math.max(1,Number(s.round)||1);
    s.target=Math.max(1,Number(s.target)||200);
    return s;
  }

  const state=load();
  const $=s=>document.querySelector(s);

  function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); $('#saveState').textContent='保存済み';}
  function numberCount(h){return Object.values(h.nums).reduce((a,b)=>a+(Number(b)||0),0)}
  function hasFlip7(h){return h.flip7 || numberCount(h)>=7}

  function ownRoundScore(h){
    const flip=hasFlip7(h);

    if(h.theZero && !flip) return 0;

    let s;
    if(h.bust){
      if(state.mode==='normal') return 0;
      s=0;
    }else{
      s=Object.entries(h.nums).reduce((a,[n,c])=>a+Number(n)*Number(c),0);
      if(h.half) s=Math.floor(s/2);
    }

    for(const m of h.mods) s-=m;

    if(state.mode==='normal') s=Math.max(0,s);

    if(flip){
      if(state.mode==='normal' || h.bonusChoice!=='attack') s+=15;
    }
    return s;
  }

  function incomingPenalty(playerIndex){
    if(state.mode!=='kill') return 0;
    let p=0;
    state.players.forEach((pl,i)=>{
      const h=pl.hand;
      if(i!==playerIndex && hasFlip7(h) && h.bonusChoice==='attack' && Number(h.attackTarget)===playerIndex) p-=15;
    });
    return p;
  }

  function shownRoundScore(i){return ownRoundScore(state.players[i].hand)+incomingPenalty(i)}

  function breakdown(i){
    const h=state.players[i].hand, flip=hasFlip7(h), incoming=incomingPenalty(i);
    const parts=[];

    if(h.theZero && !flip){
      parts.push('The Zero → 0点');
    } else if(h.bust){
      if(state.mode==='normal') parts.push('BUST → 0点');
      else {
        parts.push('BUST → 基礎0点');
        const minus=h.mods.reduce((a,b)=>a+b,0);
        if(minus) parts.push(`修正 −${minus}`);
      }
    } else {
      let s=Object.entries(h.nums).reduce((a,[n,c])=>a+Number(n)*Number(c),0);
      parts.push(`数字合計 ${s}`);
      if(h.half){s=Math.floor(s/2);parts.push(`÷2 → ${s}`)}
      const minus=h.mods.reduce((a,b)=>a+b,0);
      if(minus){s-=minus;if(state.mode==='normal')s=Math.max(0,s);parts.push(`−${minus} → ${s}`)}
    }

    if(flip){
      if(state.mode==='kill' && h.bonusChoice==='attack'){
        const t=state.players[Number(h.attackTarget)];
        parts.push(t?`${t.name} に −15`:'相手に −15');
      }else parts.push('Flip 7 +15');
    }
    if(incoming) parts.push(`他プレイヤーから ${incoming}`);
    parts.push(`今回 ${shownRoundScore(i)}点`);
    return parts.join('　');
  }

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  function renderPlayers(){
    const wrap=$('#players');wrap.innerHTML='';
    state.players.forEach((p,i)=>{
      const rs=shownRoundScore(i);
      const card=document.createElement('button');
      card.type='button';card.className='player'+(i===state.active?' active':'');
      card.innerHTML=`<input class="pname" data-name="${i}" value="${esc(p.name)}" aria-label="プレイヤー${i+1}名">
      <div class="scores"><div><div class="small">累計</div><div class="big ${p.total<0?'negative':''}">${p.total}</div></div>
      <div style="text-align:right"><div class="small">今回</div><div class="live ${rs<0?'negative':''}">${rs}</div></div></div>`;
      card.addEventListener('click',e=>{if(e.target.matches('input'))return;state.active=i;save();render()});
      wrap.appendChild(card);
    });
    wrap.querySelectorAll('.pname').forEach(inp=>{
      inp.addEventListener('click',e=>e.stopPropagation());
      inp.addEventListener('change',e=>{const i=Number(e.target.dataset.name);state.players[i].name=e.target.value.trim()||`PLAYER ${i+1}`;save();render()});
    });
  }

  function renderNumbers(){
    const h=state.players[state.active].hand,wrap=$('#numButtons');wrap.innerHTML='';
    for(let n=0;n<=13;n++){
      const c=h.nums[n]||0,b=document.createElement('button');
      b.type='button';b.className='btn'+(c?' on':'');b.textContent=(n===13&&c===2)?'13×2':String(n);
      b.addEventListener('click',()=>{
        const cur=h.nums[n]||0;
        if(n===13&&h.lucky13) h.nums[n]=(cur+1)%3; else h.nums[n]=cur?0:1;
        if(n===0)h.theZero=!!h.nums[0];
        save();render();
      });
      wrap.appendChild(b);
    }
  }

  function renderMods(){
    const h=state.players[state.active].hand;
    document.querySelectorAll('[data-mod]').forEach(b=>{
      const v=b.dataset.mod,on=v==='half'?h.half:h.mods.includes(Number(v));b.classList.toggle('on',on);
    });
    $('#bustBtn').classList.toggle('on',h.bust);
    $('#flip7Btn').classList.toggle('on',hasFlip7(h));
    $('#zeroBtn').classList.toggle('on',h.theZero);
    $('#lucky13Btn').classList.toggle('on',h.lucky13);
    $('#unluckyBtn').classList.toggle('on',h.unlucky);
  }

  function renderAttack(){
    const h=state.players[state.active].hand;
    const show=state.mode==='kill'&&hasFlip7(h);
    $('#attackBox').classList.toggle('hidden',!show);
    if(!show)return;
    $('#selfBonusBtn').classList.toggle('on',h.bonusChoice!=='attack');
    $('#attackBonusBtn').classList.toggle('on',h.bonusChoice==='attack');

    const sel=$('#attackTarget');
    sel.innerHTML=state.players.map((p,i)=>i===state.active?'':`<option value="${i}">${esc(p.name)} −15</option>`).join('');
    if(h.attackTarget===null || Number(h.attackTarget)===state.active){
      h.attackTarget=(state.active+1)%4;
    }
    sel.value=String(h.attackTarget);
    sel.classList.toggle('hidden',h.bonusChoice!=='attack');
  }

  function render(){
    const p=state.players[state.active],rs=shownRoundScore(state.active);
    $('#activeName').textContent=p.name;
    $('#liveScore').textContent=rs;
    $('#liveScore').classList.toggle('negative',rs<0);
    $('#formula').textContent=breakdown(state.active);
    $('#roundLabel').textContent=`Round ${state.round} / 目標 ${state.target}`;
    $('#normalModeBtn').classList.toggle('on',state.mode==='normal');
    $('#killModeBtn').classList.toggle('on',state.mode==='kill');
    renderPlayers();renderNumbers();renderMods();renderAttack();

    const winners=state.players.filter(p=>p.total>=state.target),win=$('#winner');
    if(winners.length){
      const max=Math.max(...state.players.map(p=>p.total)),tops=state.players.filter(p=>p.total===max);
      win.textContent=`現在トップ: ${tops.map(p=>p.name).join(' / ')} (${max}点)`;
      win.classList.remove('hidden');
    }else win.classList.add('hidden');
  }

  document.querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{
    const h=state.players[state.active].hand,v=b.dataset.mod;
    if(v==='half')h.half=!h.half;
    else{const n=Number(v),idx=h.mods.indexOf(n);idx>=0?h.mods.splice(idx,1):h.mods.push(n)}
    save();render();
  }));

  $('#normalModeBtn').addEventListener('click',()=>{state.mode='normal';save();render()});
  $('#killModeBtn').addEventListener('click',()=>{state.mode='kill';save();render()});
  $('#bustBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.bust=!h.bust;save();render()});
  $('#flip7Btn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.flip7=!h.flip7;if(!hasFlip7(h)){h.bonusChoice='self';h.attackTarget=null}save();render()});
  $('#zeroBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.theZero=!h.theZero;h.nums[0]=h.theZero?1:0;save();render()});
  $('#lucky13Btn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.lucky13=!h.lucky13;if(!h.lucky13&&(h.nums[13]||0)>1)h.nums[13]=1;save();render()});
  $('#unluckyBtn').addEventListener('click',()=>{const h=blankHand();h.unlucky=true;h.nums[7]=1;state.players[state.active].hand=h;save();render()});
  $('#clearBtn').addEventListener('click',()=>{state.players[state.active].hand=blankHand();save();render()});
  $('#selfBonusBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.bonusChoice='self';save();render()});
  $('#attackBonusBtn').addEventListener('click',()=>{const h=state.players[state.active].hand;h.bonusChoice='attack';if(h.attackTarget===null||Number(h.attackTarget)===state.active)h.attackTarget=(state.active+1)%4;save();render()});
  $('#attackTarget').addEventListener('change',e=>{state.players[state.active].hand.attackTarget=Number(e.target.value);save();render()});
  $('#nextPlayerBtn').addEventListener('click',()=>{state.active=(state.active+1)%4;save();render()});

  $('#commitBtn').addEventListener('click',()=>{
    const scores=state.players.map((_,i)=>shownRoundScore(i));
    state.history.push({scores,mode:state.mode});
    scores.forEach((s,i)=>state.players[i].total+=s);
    state.players.forEach(p=>p.hand=blankHand());
    state.active=0;state.round+=1;save();render();
  });

  $('#undoRoundBtn').addEventListener('click',()=>{
    const last=state.history.pop();if(!last)return;
    last.scores.forEach((s,i)=>state.players[i].total-=s);
    state.round=Math.max(1,state.round-1);state.players.forEach(p=>p.hand=blankHand());state.active=0;save();render();
  });

  $('#newGameBtn').addEventListener('click',()=>{
    if(!confirm('現在の得点を消して新しいゲームを開始しますか？'))return;
    state.round=1;state.active=0;state.history=[];state.players.forEach(p=>{p.total=0;p.hand=blankHand()});save();render();
  });

  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  render();
})();
</script>
</body>
</html>
